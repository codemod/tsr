[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/codemod-com/tsr"
authors = ["the tsr contributors"]

[workspace.dependencies]
tsr-core = { path = "crates/tsr-core" }
tsr-ast = { path = "crates/tsr-ast" }
tsr-binder = { path = "crates/tsr-binder" }
tsr-diagnostics = { path = "crates/tsr-diagnostics" }
tsr-scanner = { path = "crates/tsr-scanner" }
tsr-parser = { path = "crates/tsr-parser" }
tsr-path = { path = "crates/tsr-path" }
tsr-compiler = { path = "crates/tsr-compiler" }
tsr-vfs = { path = "crates/tsr-vfs" }
tsr-module = { path = "crates/tsr-module" }
tsr-tsoptions = { path = "crates/tsr-tsoptions" }
tsr-dts = { path = "crates/tsr-dts" }
tsr-printer = { path = "crates/tsr-printer" }
tsr-declarations = { path = "crates/tsr-declarations" }
tsr-checker = { path = "crates/tsr-checker" }
tsr-execute = { path = "crates/tsr-execute" }

# Foundations. These mirror oxc's dependency choices (see PLAN.md §3.1); we take
# oxc's bill of materials, not oxc's crates.
allocator-api2 = "0.2.21"        # Allocator trait, stable on stable Rust
bitflags = "2.9"                 # NodeFlags / ModifierFlags / TransformFlags
hashbrown = { version = "0.15", default-features = false, features = ["allocator-api2", "inline-more"] }
index_vec = "0.1.4"              # Typed index vectors
nonmax = "0.5.5"                 # NonMaxU32 ids, so Option<Id> is 4 bytes
rayon = "1.12"                   # Data parallelism across files
rustc-hash = "2"                 # Fast non-cryptographic hashing
self_cell = "1.2"                # Self-referential arena + AST storage
smallvec = { version = "1.15", features = ["union"] }
# Grows the stack on demand, as rustc's `ensure_sufficient_stack` does. A
# deliberate addition to oxc's bill of materials rather than a copy of it; see
# ADR-0030 for why the alternative (depth guards on every recursive walk) was
# tried first and abandoned.
stacker = "0.1.25"

# Codegen (xtask only).
anyhow = "1"
convert_case = "0.11"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing"] }

# Testing.
insta = "1"

[workspace.lints.rust]
# `unsafe` is the reason to use Rust rather than Zig or C, so it is denied by
# default and allowed only where it is genuinely unavoidable — currently the bump
# allocator and one `Send` impl, both of which carry a written justification. See
# docs/adr/0011-unsafe-is-opt-in.md.
#
# `deny` rather than `forbid`: `forbid` cannot be lifted even with a documented
# `#[allow]`, which would push the arena into a separate crate for no benefit.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Generated AST code is inherently large and repetitive; these fire constantly
# without indicating a real problem.
module_name_repetitions = "allow"
too_many_lines = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# **Build speed is a measurement cost here, not a shipping cost.** This port has
# no released binary; `release` exists so the conformance corpus (9,538 cases,
# 49k baselines) runs in seconds rather than minutes. Every arm is measured by
# touching one checker file and re-running, dozens of times a session, so the
# *rebuild* is on the critical path and the last 5% of runtime speed is not.
#
# `lto = "thin"` with `codegen-units = 1` costs ~15s of whole-program relink on
# every one-file change and buys single-digit-percent runtime. Both are off.
# `opt-level` stays at 3: the conformance run is compute-bound and dropping it
# makes the run *much* slower, which is the opposite of the goal.
#
# `[profile.dist]` below keeps the slow-and-fast build for anyone who needs it.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"

# The old `release`: whole-program LTO, one codegen unit. For a shipped
# artefact or a benchmark where the last few percent matter.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# Release code with symbols, for `perf`.
#
# Frame pointers matter here — perf's DWARF unwinding is slower and less reliable
# through inlined Rust, and without them the call graph is mostly `[unknown]` —
# but `force-frame-pointers` is a rustc codegen flag, not a Cargo profile key.
# Cargo silently ignores unknown keys with a warning, so setting it here did
# nothing. Pass it through the environment instead:
#
#     RUSTFLAGS="-C force-frame-pointers=yes" \
#       cargo build --profile profiling -p tsr-parser --example parse_loop
[profile.profiling]
inherits = "release"
debug = true
strip = false

# Codegen and conformance runs are unusably slow in a debug build against a
# 49k-baseline corpus.
[profile.dev.package."*"]
opt-level = 2

# Debuginfo generation dominates a debug build on macOS, and nothing in this
# workspace is debugged under a debugger — failures are read from assertions and
# from the corpus. Line tables keep panic backtraces useful, which is the only
# thing the debug info is actually used for.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
