[package]
name = "tsr-declarations"
description = "The declaration transform: AST to .d.ts AST, around a resolver seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
tsr-ast = { workspace = true }
tsr-core = { workspace = true }
tsr-diagnostics = { workspace = true }
tsr-dts = { workspace = true }
# For grafting JSDoc `{type}` texts into the declaration tree
# (`Factory::parse_grafted_type`); the transform is otherwise parser-free.
tsr-parser = { workspace = true }
tsr-printer = { workspace = true }
rustc-hash = { workspace = true }

[dev-dependencies]
tsr-parser = { workspace = true }
tsr-diagnostics = { workspace = true }

[lints]
workspace = true
