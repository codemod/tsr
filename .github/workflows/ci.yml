name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Serialised against `perf.yml`, which shares this runner label.
#
# Measured 2026-08-05: the perf gate failed with `checker.ts` at 1.320 and
# `dom.generated.d.ts` at 1.449 while the code had not regressed — the same
# benchmark on an idle machine reads 23.31 ms and 8.94 ms, against baselines of
# 22.50 and 8.97. Saturating the host and changing nothing else reproduces the
# CI numbers within 6%. Upstream's half of that run came in *faster* than its
# recorded baseline, so the runner was not slow; our benchmark's window was
# contended, and this job is what contended for it.
#
# `cancel-in-progress: false`, deliberately: the point is to make the two jobs
# take turns, not to have either kill the other. The cost is throughput on
# concurrent pushes; a benchmark that measures the neighbours is worth less than
# no benchmark, because it fails loudly and trains people to re-run it. See
# [ADR-0009](../../docs/adr/0009-performance-gate.md) and `bd tsr-1xm`.
concurrency:
  group: self-hosted-exclusive
  cancel-in-progress: false

jobs:
  test:
    name: build, test, lint
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          # `recursive`, not `true`: the conformance corpus lives in the
          # TypeScript submodule *inside* typescript-go, and `true` stops at the
          # first level. With only the first level the harness finds no cases and
          # reports 100% of nothing.
          submodules: recursive
          # Shallow. The two submodules carry well over a decade of history that
          # nothing here reads — we only ever check out the pinned commit — and
          # `fetch-depth: 1` makes actions/checkout pass `--depth=1` to the
          # submodule fetch as well. This is the difference between a clone
          # measured in minutes and one measured in seconds.
          fetch-depth: 1

      # Pinned to the same version as `rust-toolchain.toml`. `@stable` would
      # install a toolchain that cargo then overrides from that file on the
      # first invocation — a wasted download, and a second source of truth for
      # which clippy decides the gate. Bump both together.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Every anchor naming an upstream symbol, file or line must still resolve
      # against the pinned submodule. This is the half of bd tsr-5e7.3 that can be
      # a gate today: broken anchors are always bugs and the count is zero, while
      # *missing* anchors number in the thousands and are reported as a rate
      # instead. See docs/architecture/upstream-anchors.md.
      - name: Upstream anchors resolve
        run: cargo run -p xtask -- anchors

      # Conformance snapshots are committed so a regression shows up as a
      # reviewable diff. CI reruns the corpus and fails if the checked-in numbers
      # no longer match — that is the ratchet.
      - name: Conformance snapshots are up to date
        run: |
          cargo run -p tsr-conformance --bin coverage
          if ! git diff --exit-code -- crates/tsr-conformance/snapshots; then
            echo "::error::Conformance numbers changed. Review the diff and commit it."
            exit 1
          fi

      # The generated AST is checked in so that a plain `cargo build` works without
      # the submodule. That only stays honest if CI proves the checked-in output
      # still matches what the generator produces.
      - name: Generated code is up to date
        run: |
          cargo run -p xtask -- codegen
          # The generator emits unformatted source; `cargo fmt` is part of the
          # pipeline, so format before diffing or this always fails.
          cargo fmt --all
          if ! git diff --exit-code -- crates/tsr-ast/src/generated; then
            echo "::error::Generated AST is stale. Run 'cargo xtask codegen' and commit."
            exit 1
          fi
