[package]
name = "tsr-conformance"
description = "Conformance harness: runs the TypeScript corpus and records pass rates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "tsr_conformance"
path = "src/lib.rs"

[[bin]]
name = "coverage"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tsr-ast = { workspace = true }
tsr-scanner = { workspace = true }
tsr-parser = { workspace = true }
tsr-core = { workspace = true }

[lints]
workspace = true
