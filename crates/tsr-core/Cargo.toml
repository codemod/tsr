[package]
name = "tsr-core"
description = "Foundational data structures for tsr: spans, typed indices, arenas, and side tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
nonmax = { workspace = true }
rustc-hash = { workspace = true }
tsr-path = { workspace = true }

# Native only: wasm32 has one linear stack fixed at link time and cannot grow it,
# so there is nothing for `stacker` to do there. See `stack::ensure_sufficient`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = { workspace = true }

[lints]
workspace = true
